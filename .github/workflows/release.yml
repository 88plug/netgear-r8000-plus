name: Build, verify, and publish

# Static-only pipeline, entirely on GitHub-hosted runners: build the image
# from the real recipe (docs/RUNBOOK.md §5), run hardware-less structural
# checks (patched-module confirmation, manifest diff, DTB sanity), publish
# if those pass. No self-hosted runner, no real-hardware test.
#
# Honest about the ceiling this implies: these checks prove the build
# reproduces cleanly and looks structurally sane - not that the radios
# actually negotiate with real BCM43602 silicon. That gap was previously
# closed by a self-hosted runner with LAN access to the operator's router
# (live-swap-and-revert test); deliberately dropped in favor of running
# entirely on GitHub's default infrastructure. See docs/RUNBOOK.md §6.

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt point release to build against, e.g. 25.12.6"
        required: true

permissions:
  contents: write

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore the gitignored wireless config (real passphrases, never committed)
        run: |
          mkdir -p v2-files/etc/config
          echo "${{ secrets.WIRELESS_CONFIG_B64 }}" | base64 -d > v2-files/etc/config/wireless
          [ -s v2-files/etc/config/wireless ] || { echo "FATAL: WIRELESS_CONFIG_B64 secret is missing or empty - see docs/RUNBOOK.md CI section"; exit 1; }

      - name: Install build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential ncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 binwalk device-tree-compiler squashfs-tools zstd

      - name: Build image
        run: .github/scripts/build-image.sh "${{ inputs.openwrt_version }}"

      - name: Fetch previous release's manifest for the diff check
        run: |
          gh release download --repo "${{ github.repository }}" --pattern '*.manifest' -D /tmp/prev-manifest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Static verify
        run: |
          PREV="$(find /tmp/prev-manifest -iname '*.manifest' 2>/dev/null | head -1)"
          .github/scripts/static-verify.sh BUILD_OUT "${PREV:-}"

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.openwrt_version }}"
          CHK="$(find BUILD_OUT -iname '*.chk' | head -1)"
          MANIFEST="$(find BUILD_OUT -iname '*.manifest' | head -1)"
          SHASUMS="$(find BUILD_OUT -iname 'sha256sums' | head -1)"

          gh release create "auto-${VERSION}" \
            "$CHK" "$MANIFEST" "$SHASUMS" \
            --repo "${{ github.repository }}" \
            --latest \
            --title "auto-${VERSION} — OpenWrt ${VERSION}, build-verified" \
            --notes "Built against OpenWrt ${VERSION}. Passed static structural checks only: patched module confirmed (not the stock feed one), package manifest reviewed for anomalies, DTB sanity checked. **Not tested against real hardware** - this pipeline runs entirely on GitHub-hosted runners with no network path to the operator's router. Compare against [v11](../v11), which was hand-flashed and lived with on real hardware. See [R8000_PLUS.md](../../blob/netgear-r8000-plus/R8000_PLUS.md) and [docs/RUNBOOK.md](../../blob/netgear-r8000-plus/docs/RUNBOOK.md#ci) for exactly what these checks do and don't prove."

      - name: Report failure (no release published)
        if: failure()
        run: |
          echo "::error::Build or static verify failed for OpenWrt ${{ inputs.openwrt_version }} - no release published."
