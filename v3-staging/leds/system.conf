
config system
	option hostname 'OpenWrt'
	option timezone 'GMT0'
	option zonename 'UTC'
	option ttylogin '0'
	option log_size '128'
	option urandom_seed '0'

config timeserver 'ntp'
	option enabled '1'
	option enable_server '0'
	list server '0.openwrt.pool.ntp.org'
	list server '1.openwrt.pool.ntp.org'
	list server '2.openwrt.pool.ntp.org'
	list server '3.openwrt.pool.ntp.org'

config led 'led_wan'
	option name 'Internet'
	option sysfs 'bcm53xx:white:wan'
	option trigger 'netdev'
	option mode 'link'
	option dev 'wan'

config led 'led_wlan2g'
	option name '2.4GHz'
	option sysfs 'bcm53xx:white:2ghz'
	option trigger 'netdev'
	option mode 'link tx rx'
	option dev 'phy1-ap0'

config led 'led_wlan5g1'
	option name '5GHz-1'
	option sysfs 'bcm53xx:white:5ghz-1'
	option trigger 'netdev'
	option mode 'link tx rx'
	option dev 'phy0-ap0'

config led 'led_wlan5g2'
	option name '5GHz-2'
	option sysfs 'bcm53xx:white:5ghz-2'
	option trigger 'netdev'
	option mode 'link tx rx'
	option dev 'phy2-ap0'

config led 'led_wps'
	option name 'WPS'
	option sysfs 'bcm53xx:white:wps'
	option default '0'

config led 'led_wireless'
	option name 'Wireless'
	option sysfs 'bcm53xx:white:wireless'
	option trigger 'netdev'
	option dev 'phy1-ap0'
	option mode 'link tx rx'

config led 'led_usb2'
	option name 'USB 2.0'
	option sysfs 'bcm53xx:white:usb2'
	option trigger 'usbport'
	list port 'usb1-port2'
	list port 'usb2-port2'

config led 'led_usb3'
	option name 'USB 3.0'
	option sysfs 'bcm53xx:white:usb3'
	option trigger 'usbport'
	list port 'usb1-port1'
	list port 'usb2-port1'
	list port 'usb4-port1'

