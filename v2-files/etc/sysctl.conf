# User defined entries should be added to this file not to /etc/sysctl.d/* as
# that directory is not backed-up by default and will not survive a reimage
#
# fib_multipath_hash_policy=1: needed for the weighted ECMP default route
# (see etc/hotplug.d/iface/31-american-multipath-default and FINDINGS.md
# #46) to actually distribute different connections across both American
# STA uplinks. The default policy (0) hashes on source+dest IP only, so
# every connection between the same two IPs - e.g. many parallel
# speedtest connections to the same handful of server IPs, or repeated
# requests to the same site - would all land on the SAME nexthop every
# time, silently defeating the whole point of a multipath route. Policy 1
# adds source/dest port to the hash, confirmed live: 10 parallel
# connections to one destination IP produced real traffic on BOTH
# uplinks' packet counters instead of just one.
net.ipv4.fib_multipath_hash_policy=1
