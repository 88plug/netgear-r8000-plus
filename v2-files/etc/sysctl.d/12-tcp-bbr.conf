# Overrides the kmod-tcp-bbr package's own postinst-installed version of
# this exact file (see FINDINGS.md #53/#54) - that package unconditionally
# ships `net.ipv4.tcp_congestion_control=bbr` here, silently overriding
# etc/sysctl.conf's deliberate decision to leave cubic as the default (a
# real A/B test showed no measurable improvement from bbr on this link -
# see #53). FILES= overlay entries win over package-installed files at
# the same path (same mechanism #40 root-caused), so this empty override
# neutralizes the package's opinion and lets the kernel's own true
# default (cubic) apply. Deliberately left with no active setting below -
# do not add tcp_congestion_control here; that decision lives in
# etc/sysctl.conf where it's actually documented.
